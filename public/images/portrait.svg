    </pattern>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbe0f5"/>
      <stop offset="55%" stop-color="#efe4d8"/>
      <stop offset="100%" stop-color="#d9e6dc"/>
